<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap Forms</title>

     <link rel="stylesheet" href="style.css">

     <!-- BOOTSTRAP -->
     <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
     <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>

     <!-- Latest compiled and minified CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Latest compiled JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

</head>
<body>

    <div class="container p-5">
<form action="" method="post">

        <h2 class="text-center text-primary">Custom Sneaker Order Form</h2>

        <label for="form-label" class="form-label">Name:</label> 
        <input type="text" name="username" id="form-name" class="textinput form-control">
    
        <label for="form-email" class="form-label">Email:</label> 
        <input type="email" name="emailaddress" id="form-email"class="textinput form-control">

        <label for="form-tel" class="form-label">Telephone:</label> 
        <input type="tel" name="telephone" id="form-tel"class="textinput form-control">

        <label for="form-story" class="form-label">Tell us about yourself:</label> 
        <textarea name="story" maxlength="600" id="form-story" placeholder="No more than 600 characters long" class="form-control"></textarea>
        
        <label for="sizes">Size:</label>
        <select name="size" id="sizes" class="form-select">
            <option>5</option>
            <option>6</option>
            <option>7</option>
            <option>8</option>
            <option>9</option>
            <option>10</option>
            <option>11</option>
            <option>12</option>
            <option>13</option>
        </select> 
        
        <em>Sizes reflect standard US men's sizes</em>
            
        <label for="colors">Sneaker Color:</label>
        <fieldset id="colors">
            <legend>Color</legend>
            <label><input type="radio" class="form-check-input" name="color" value="red"> Red</label>
            <label><input type="radio" class="form-check-input" name="color" value="blue"> Blue</label> 
            <label><input type="radio" class="form-check-input" name="color" value="black"> Black</label> 
            <label><input type="radio" class="form-check-input" name="color" value="silver"> Silver</label>
        </fieldset>
            
        <label for="features">Add-on Features:</label>
        <fieldset id="features">
            <legend>Feature</legend>
            <div class="form-check">
  <input class="form-check-input" type="checkbox" id="check1" name="option1" value="something" checked>
  <label class="form-check-label">Sparkly Laces</label>
</div>
           <div class="form-check">
  <input class="form-check-input" type="checkbox" id="check1" name="option1" value="something" checked>
  <label class="form-check-label">Metallic Logo</label>
</div>           <div class="form-check">
  <input class="form-check-input" type="checkbox" id="check1" name="option1" value="something" checked>
  <label class="form-check-label">Light up heels</label>
</div>           <div class="form-check">
  <input class="form-check-input" type="checkbox" id="check1" name="option1" value="something" checked>
  <label class="form-check-label">MP3-enabled</label>
</div>
        </fieldset>
            
       <button type="button" class="btn btn-primary mt-3" value="ENTER">ENTER</button>
     </form>
    </div>
    
    
</body>
</html>
